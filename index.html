<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANIVERSÁRIO DO FAZENDEIRO ERIC</title>

    <!-- FOTO DA ABA DO NAVEGADOR -->
    <link rel="icon" type="image/png" href='css/img/ericc.png'>

     <!-- IMAGEM DE PRÉ-VISUALIZAÇÃO DO LINK NO WHATSAPP -->
    <meta property="og:title" content="ANIVERSÁRIO DO FAZENDEIRO ERIC">
    <meta property="og:description" content="Convite do aniversário de 02 aninhos do Eric!">
    <!-- Mudamos o final para ?v=novafoto para o WhatsApp limpar o cache do Julio imediatamente -->
    <meta property="og:image" content="https://vercel.app">
<meta property="og:image:secure_url" content="https://vercel.app">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://convite-do-fazendeiro-eric-02-aninh.vercel.app/">

    <style>

        /* ==========================================================
           CONFIGURAÇÃO GERAL
        ========================================================== */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;
            overflow-y: auto;

            background-image: url('img3/mato.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            padding: 20px 10px;
        }


        /* ==========================================================
           TELA DE ENTRADA
        ========================================================== */

        #tela-entrada {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background-image: url('img3/mato.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;

            padding: 20px;
        }


        .btn-entrar {
            padding: 18px 40px;

            max-width: 90vw;

            font-family: Arial, sans-serif;

            font-size: 22px;

            font-weight: bold;

            color: #000000;

            background:
                linear-gradient(
                    135deg,
                    #ffc505 35%,
                    #e65100 100%
                );

            border: 2px solid #f1b10193;

            border-radius: 35px;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgb(255, 174, 0);
        }


        /* ==========================================================
           ÁREA DO CONVITE
        ========================================================== */

        .card-wrapper {
            width: 100%;
            max-width: 500px;

            display: flex;

            flex-direction: column;

            align-items: center;
            justify-content: center;

            gap: 20px;

            margin: auto;

            visibility: hidden;
        }


        /* ==========================================================
           CARTÃO
        ========================================================== */

        .birthdayCard {
            position: relative;

            width: 440px;
            height: 600px;

            max-width: 90vw;

            cursor: pointer;

            transform-style: preserve-3d;

            transform:
                perspective(2500px);

            margin: 0 auto;
        }


        /* ==========================================================
           CARTÃO ABERTO
        ========================================================== */

        .birthdayCard.open {
            box-shadow:
                0 15px 60px
                rgba(0, 0, 0, 0.6);
        }


        .birthdayCard.open .cardFront {
            transform:
                rotateY(-160deg);
        }


        /* ==========================================================
           CAPA
           
           NÃO ALTERADA
        ========================================================== */

        .cardFront {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            transform-origin: left;

            box-shadow:
                inset 100px 20px 100px
                rgba(0,0,0,.13),

                30px 0 50px
                rgba(0,0,0,0.1);

            transition:
                1s ease;

            z-index: 2;

            transform-style: preserve-3d;

            backface-visibility: hidden;

            background-image:
                url('css/img/ericc.png');

            background-size:
                cover;

            background-repeat:
                no-repeat;

            background-position:
                center;
        }


        /* ==========================================================
           VERSO ANTIGO DA CAPA
           
           O TEXTO AGORA ESTÁ NA PARTE INTERNA
        ========================================================== */

        .cardFront-verso {
            display: none !important;
        }


        /* ==========================================================
           ELEMENTOS ANTIGOS
        ========================================================== */

        .happy,
        .toyou,
        .bday,
        .wrap-deco,
        .decorations,
        .plate,
        .front-text,
        .texto-capa {
            display: none !important;
        }


        /* ==========================================================
           PARTE INTERNA
           
           FOTO DO ERIC
        ========================================================== */

        .cardInside {
            position: absolute;

            width: 100%;
            height: 100%;

            z-index: 1;

            left: 0;
            top: 0;

            box-shadow:
                inset 100px 20px 100px
                rgba(0,0,0,0.2);

            background-color:
                #ffffff;

            background-image:
                url('css/img2/13.png');

            background-size:
                cover;

            background-repeat:
                no-repeat;

            background-position:
                center;

            overflow:
                hidden;
        }


        /* ==========================================================
           INFORMAÇÕES SOBRE A FOTO
           
           MAIS TRANSPARENTE PARA O ERIC APARECER
        ========================================================== */

        .conteudo-interno {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            padding:
                40px 25px;

            display: flex;

            flex-direction: column;

            justify-content: flex-start;

            align-items: center;

            gap:
                20px;

            overflow-y:
                auto;

            overflow-x:
                hidden;

            background:
                rgba(255, 255, 255, 0.55);
        }


        /* ==========================================================
           TÍTULO
        ========================================================== */

        .conteudo-interno h2 {
            font-family:
                'Comic Sans MS',
                Arial,
                sans-serif;

            font-size:
                32px;

            line-height:
                1.1;

            color:
                #c52e00;

            text-align:
                center;

            margin:
                0 0 5px 0;

            text-shadow:
                1px 1px 0
                rgba(255,255,255,0.9);
        }


        /* ==========================================================
           FRASES
        ========================================================== */

        .conteudo-interno p {
            font-family:
                Arial,
                sans-serif;

            font-size:
                16px;

            color:
                #000000;

            line-height:
                1.45;

            margin:
                0;

            font-weight:
                bold;

            text-align:
                center;

            text-shadow:
                0 1px 2px
                rgba(255,255,255,0.8);
        }


        /* ==========================================================
           CORES DAS FRASES
        ========================================================== */

        .frase-1 {
            color:
                #d62828 !important;
        }

        .frase-2 {
            color:
                #2e7d32 !important;
        }

        .frase-3 {
            color:
                #e65100 !important;
        }

        .frase-4 {
            color:
                #5d4037 !important;
        }


        /* ==========================================================
           DATA E HORA
        ========================================================== */

        .bloco-dados {
            width: 100%;

            background:
                rgba(255, 152, 0, 0.15);

            border:
                2px dashed #ff9800;

            padding:
                15px;

            border-radius:
                8px;

            margin:
                5px 0;
        }


        .bloco-dados p {
            font-size:
                17px;

            margin:
                6px 0;
        }


        .data-festa {
            color:
                #c62828 !important;
        }


        .hora-festa {
            color:
                #2e7d32 !important;
        }


        /* ==========================================================
           BOTÕES — AGORA FICAM ABAIXO DO CONVITE
        ========================================================== */

        .card-buttons {
            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            gap:
                10px;

            width:
                440px;

            max-width:
                90vw;

            z-index:
                10;

            opacity:
                0;

            visibility:
                hidden;

            transform:
                translateY(-10px);

            transition:
                opacity 0.6s ease,
                transform 0.6s ease,
                visibility 0.6s;
        }


        .card-buttons.show-buttons {
            opacity:
                1;

            visibility:
                visible;

            transform:
                translateY(0);
        }


        /* ==========================================================
           BOTÕES
        ========================================================== */

        .btn {
            display: flex;

            align-items: center;
            justify-content: center;

            width:
                100%;

            min-height:
                48px;

            padding:
                10px;

            font-family:
                Arial,
                sans-serif;

            font-size:
                13px;

            font-weight:
                bold;

            line-height:
                1.2;

            text-align:
                center;

            text-decoration:
                none;

            color:
                #ffffff;

            border-radius:
                25px;

            box-shadow:
                0 4px 6px
                rgba(0,0,0,0.2);

            transition:
                transform 0.2s;
        }


        .btn:hover {
            transform:
                scale(1.05);
        }


        /* ==========================================================
           WHATSAPP
        ========================================================== */

        .btn-whatsapp {
            background:
                linear-gradient(
                    135deg,
                    #25d366 0%,
                    #128c7e 100%
                );
        }


        /* ==========================================================
           LOCAL
        ========================================================== */

        .btn-location {
            background:
                linear-gradient(
                    135deg,
                    #ff9800 0%,
                    #e65100 100%
                );
        }


        /* ==========================================================
           📱 CELULAR
        ========================================================== */

        @media screen and (max-width: 600px) {

            body {
                display:
                    block;

                min-height:
                    100dvh;

                padding:
                    10px 0 30px;

                overflow-x:
                    hidden;

                overflow-y:
                    auto;
            }


            .card-wrapper {
                width:
                    100%;

                max-width:
                    none;

                padding:
                    10px 0 20px;

                gap:
                    15px;
            }


            .birthdayCard {
                width:
                    94vw;

                max-width:
                    440px;

                height:
                    125vw;

                max-height:
                    600px;

                min-height:
                    480px;

                margin:
                    0 auto;
            }


            /* ======================================================
               INTERNO NO CELULAR
            ====================================================== */

            .conteudo-interno {
                padding:
                    25px 18px;

                gap:
                    13px;

                background:
                    rgba(255, 255, 255, 0.55);
            }


            .conteudo-interno h2 {
                font-size:
                    clamp(
                        20px,
                        6vw,
                        30px
                    );
            }


            .conteudo-interno p {
                font-size:
                    clamp(
                        11px,
                        3.6vw,
                        16px
                    );

                line-height:
                    1.4;
            }


            .bloco-dados {
                padding:
                    10px;
            }


            .bloco-dados p {
                font-size:
                    clamp(
                        11px,
                        3.5vw,
                        16px
                    );

                line-height:
                    1.3;

                margin:
                    4px 0;
            }


            /* BOTÕES ABAIXO DO CONVITE */

            .card-buttons {
                width:
                    94vw;

                max-width:
                    440px;

                gap:
                    8px;

                flex-direction:
                    column;
            }


            .btn {
                min-height:
                    50px;

                padding:
                    9px 6px;

                font-size:
                    clamp(
                        9px,
                        3vw,
                        13px
                    );
            }
        }


        /* ==========================================================
           📱 CELULARES PEQUENOS
        ========================================================== */

       /* AJUSTE MÍNIMO: centralização e tamanho no celular */
@media screen and (max-width: 600px) {
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    .card-wrapper {
        width: 100%;
        margin: 0 auto;
        align-items: center;
    }

    .birthdayCard {
        width: min(94vw, 440px);
        height: 125vw;
        max-height: 600px;
        min-height: 0;
        margin-left: auto;
        margin-right: auto;
    }

    .card-buttons {
        margin-left: auto;
        margin-right: auto;
    }
}

@media screen and (max-width: 380px) {
    .birthdayCard {
        min-height: 0;
    }
}


        /* ==========================================================
           📱 CELULAR MUITO PEQUENO
        ========================================================== */

        @media screen and (max-width: 340px) {

            .birthdayCard {
                width:
                    94vw;

                height:
                    125vw;

                min-height:
                    430px;
            }


            .conteudo-interno h2 {
                font-size:
                    18px;
            }


            .conteudo-interno p {
                font-size:
                    9px;

                line-height:
                    1.3;
            }


            .bloco-dados p {
                font-size:
                    9px;
            }


            .btn {
                font-size:
                    8px;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================================================
         TELA DE ENTRADA
    ========================================================== -->

    <div id="tela-entrada">

        <button
            class="btn-entrar"
            onclick="
                document.getElementById('bgMusic').play();
                this.parentElement.style.display='none';
                document.querySelector('.card-wrapper').style.visibility='visible';
            "
        >
            <strong>🐣 Tem festa vindo aí… e você é nosso convidado especial! 🐣</strong>
        </button>

    </div>


    <!-- ==========================================================
         MÚSICA
    ========================================================== -->

    <audio
        id="bgMusic"
        src="audio/cocorico.mp3"
        preload="none"
        loop>
    </audio>


    <!-- ==========================================================
         CONVITE
    ========================================================== -->

    <div class="card-wrapper">


        <!-- ======================================================
             CARTÃO
        ====================================================== -->

        <div
            class="birthdayCard"

            onclick="
                this.classList.add('open');

                document
                    .getElementById('botoes-acao')
                    .classList.add('show-buttons');
            "
        >


            <!-- ==================================================
                 CAPA DO COCORICÓ
                 
                 NÃO FOI ALTERADA
            ================================================== -->

            <div class="cardFront">
            </div>


            <!-- ==================================================
                 PARTE INTERNA
                 
                 FOTO DO ERIC + TEXTO
            ================================================== -->

            <div class="cardInside">
            </div>


        </div>


        <!-- ==========================================================
             BOTÕES DE AÇÃO
             
             AGORA ESTÃO FORA DO CARTÃO
             E APARECEM EMBAIXO DELE
        ========================================================== -->

        <div id="botoes-acao" class="card-buttons">


            <!-- WHATSAPP -->

            <a
                href="https://wa.me/5519996789314?text=Presen%C3%A7a%20confirmada%20no%20paiol!%20J%C3%A1%20separei%20minhas%20botas%20e%20meu%20chap%C3%A9u%20de%20palha.%20Pode%20contar%20comigo%20para%20encarar%20a%20festa%20e%20ajudar%20a%20comer%20todos%20os%20doces!"
                target="_blank"
                class="btn btn-whatsapp"
            >
                <strong>
                    CONFIRMAR COM A MAMÃE
                </strong>
            </a>


            <!-- LOCAL -->

            <a
                href="https://maps.app.goo.gl/LYmkdDKAwS8KjAyYA"
                target="_blank"
                class="btn btn-location"
            >
                <strong>
                    LOCAL DA FAZENDA
                </strong>
            </a>


        </div>


    </div>


</body>

</html>
